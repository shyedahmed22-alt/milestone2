<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        .cont, .inner{
            width: 200px;
            height: 200px;
        }
        .cont{
            border: 2px solid firebrick;
            background-color: darkgray;
        }
        .inner{
            border: 2px solid steelblue;
            background-color: palegoldenrod;
            /* transform: scale(0.5, 0.25); */
            transform: rotate(45deg);
        }
        </style>
</head>
<body>
    <h2>Explore Transform and Translate</h2>
    <div class="cont">Container 1
        <div class="inner">Inner 1</div>
    </div>
    <div class="cont">Container 2
        <div class="inner">Inner 2</div>
    </div>
    <div class="cont">Container 3
        <div class="inner">Inner 3</div>
    </div>
</body>
</html>
