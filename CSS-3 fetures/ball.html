<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 500px;
            background-color: rgb(197, 247, 242);
        }
        .ball{
            background-color: black;
            height: 100px;
            width: 100px;
            border-radius: 50%;
            transition: transform 1s;
        }
        .ball:hover{
            transform:translate(300px, 400px);
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="ball"></div>
    </div>
</body>
</html>
