<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: bisque;
            border: 10px solid red;
            /* transition: width 0.5s ease 1s, background-color 1s ease 1s,; */
            transition: transform 1s;
        }
        .box:hover{
               /* width: 122px;
               background-color: aqua; */
               transform: rotate(30deg) scale(1.5) translateX(50px);
        }
    </style>
</head>
<body>
    <ul>
        <li>Transform: change the shape. This is a css style property name</li>
        <li>Translate: it is a vlue of the transform style rule.this means you move either x or y or both axis</li>
    </ul>
    <div class="box">box 1</div>
    <div class="box">box 2</div>
    <div class="box">box 3</div>
</body>
</html>
